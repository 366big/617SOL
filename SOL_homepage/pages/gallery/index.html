</nav></header><main><section class="page-hero"><div class="page-hero-inner reveal"><div class="eyebrow">SOL MOMENTS</div><h1>우리가 함께 만든<br><em>순간들.</em></h1><p>전투의 순간부터 아무것도 아닌 듯한 일상의 순간까지. SOL에서 함께한 기억을 하나씩 남겨갑니다.</p></div></section><section class="section alt"><div class="container"><div class="masonry">
<div class="m-item reveal"><img src="/assets/images/sol-01.jpg" alt="SOL Moment 01" loading="lazy"></div>
<div class="m-item reveal"><img src="/assets/images/sol-02.jpg" alt="SOL Moment 02" loading="lazy"></div>
<div class="m-item reveal"><img src="/assets/images/sol-03.jpg" alt="SOL Moment 03" loading="lazy"></div>
<div class="m-item reveal"><img src="/assets/images/sol-04.jpg" alt="SOL Moment 04" loading="lazy"></div>
</div></div></section></main><footer class="footer"><div class="footer-inner"><div><div class="footer-brand">SOL</div><p>Together, At Our Own Pace.</p></div><div class="footer-right">Kingdom 617 · Korean Alliance<br>각자의 속도로, 함께.</div></div></footer><script>
(() => {
  const grid = document.getElementById('solGalleryGrid');
  if (!grid) return;

  // gallery/index.html 기준: ../../assets/images/
  // sol-01.jpg 형식과 sol-1.jpg 형식을 모두 지원합니다.
  const base = '../../assets/images/';
  const maxPhotos = 200;

  const loadImage = (src, n) => new Promise(resolve => {
    const img = new Image();
    img.onload = () => resolve({src, n});
    img.onerror = () => resolve(null);
    img.src = src;
  });

  const jobs = [];
  for (let n = 1; n <= maxPhotos; n++) {
    const padded = String(n).padStart(2, '0');
    jobs.push(loadImage(`${base}sol-${padded}.jpg`, n));
    jobs.push(loadImage(`${base}sol-${n}.jpg`, n));
  }

  Promise.all(jobs).then(results => {
    const seen = new Set();
    const photos = results.filter(Boolean).filter(x => {
      if (seen.has(x.n)) return false;
      seen.add(x.n);
      return true;
    }).sort((a,b) => a.n - b.n);

    grid.innerHTML = '';

    if (!photos.length) {
      grid.innerHTML = '<div class="gallery-empty">함께한 순간들이 이곳에 기록됩니다.</div>';
      return;
    }

    photos.forEach(({src, n}) => {
      const item = document.createElement('div');
      item.className = 'm-item reveal';
      item.innerHTML = `<img src="${src}" alt="SOL Moment ${String(n).padStart(2,'0')}" loading="lazy">`;
      grid.appendChild(item);
    });

    if (window.initReveal) window.initReveal();
  });
})();
</script>
<script src="../../js/main.js"></script></body></html>
